services:
  db:
    image: postgres:18
    container_name: clima_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-clima}
      POSTGRES_PASSWORD: ${DB_PASS:-clima123}
      POSTGRES_DB: ${DB_NAME:-clima_db}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-clima} -d ${DB_NAME:-clima_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 1.0

  redis:
    image: redis:7-alpine
    container_name: clima_redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 160m
    cpus: 0.25

  app:
    build: .
    container_name: clima_app
    restart: unless-stopped
    volumes:
      - noticias_uploads:/app/app/static/uploads/noticias
      - capturas_mapas:/app/app/static/img/reporte-velez/capturas
      - archivo_capturas_comprimidas:/app/archivo_datos/capturas_mapas
    environment:
      DB_USER: ${DB_USER:-clima}
      DB_PASS: ${DB_PASS:-clima123}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-clima_db}
      REDIS_URL: redis://redis:6379/0
      STATION_PASSKEY: ${STATION_PASSKEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      ENABLE_TEST_ENDPOINT: ${ENABLE_TEST_ENDPOINT:-false}
      MODO_MANTENIMIENTO: ${MODO_MANTENIMIENTO:-false}
      ADMIN_PASSKEY: ${ADMIN_PASSKEY:-}
      WU_API_KEY: ${WU_API_KEY:-}
      LIMITE_HORA_COLOMBIA: ${LIMITE_HORA_COLOMBIA:-1000 per hour}
      LIMITE_HORA_EXTRANJERO: ${LIMITE_HORA_EXTRANJERO:-50 per hour}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_TO: ${EMAIL_TO:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    expose:
      - "8080"
    ports:
      - "8082:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0

  poller:
    build: .
    container_name: clima_poller
    restart: unless-stopped
    command: ["python", "scripts/wu_poller.py"]
    environment:
      WU_STATION_ID: ${WU_STATION_ID:-}
      WU_API_KEY: ${WU_API_KEY:-}
      WU_POLL_INTERVAL: ${WU_POLL_INTERVAL:-60}
      WU_TARGET_URL: http://app:8080/data/report/
      STATION_PASSKEY: ${STATION_PASSKEY:-}
    depends_on:
      - app
    mem_limit: 128m
    cpus: 0.25

  historial_poller:
    build: .
    container_name: clima_historial_poller
    restart: unless-stopped
    command: ["python", "scripts/historial_estaciones_poller.py"]
    environment:
      DB_USER: ${DB_USER:-clima}
      DB_PASS: ${DB_PASS:-clima123}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-clima_db}
      WU_API_KEY: ${WU_API_KEY:-}
      HISTORIAL_POLL_INTERVAL: ${HISTORIAL_POLL_INTERVAL:-1800}
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.25

  lecturas_fews_poller:
    build: .
    container_name: clima_lecturas_fews
    restart: unless-stopped
    command: ["python", "scripts/lecturas_fews_poller.py"]
    environment:
      DB_USER: ${DB_USER:-clima}
      DB_PASS: ${DB_PASS:-clima123}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-clima_db}
      LECTURAS_FEWS_INTERVALO: ${LECTURAS_FEWS_INTERVALO:-86400}
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.25

  publicador_velez:
    build: .
    container_name: clima_publicador_velez
    restart: unless-stopped
    command: ["python", "scripts/publicar_reporte_velez.py"]
    environment:
      DB_USER: ${DB_USER:-clima}
      DB_PASS: ${DB_PASS:-clima123}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-clima_db}
      REPORTE_VELEZ_INTERVALO: ${REPORTE_VELEZ_INTERVALO:-604800}
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.25

  capturas_mapas_poller:
    build: .
    container_name: clima_capturas_mapas
    restart: unless-stopped
    command: ["python", "scripts/capturas_mapas_poller.py"]
    volumes:
      - capturas_mapas:/app/app/static/img/reporte-velez/capturas
      - archivo_capturas_comprimidas:/app/archivo_datos/capturas_mapas
    environment:
      DB_USER: ${DB_USER:-clima}
      DB_PASS: ${DB_PASS:-clima123}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-clima_db}
      CAPTURAS_MAPAS_INTERVALO: ${CAPTURAS_MAPAS_INTERVALO:-86400}
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.25

  reporter:
    build: .
    container_name: clima_reporter
    restart: unless-stopped
    command: ["python", "scripts/email_reporter.py"]
    environment:
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_TO: ${EMAIL_TO:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      REPORT_FREQUENCY: ${REPORT_FREQUENCY:-weekly}
      REPORT_HOUR_UTC: ${REPORT_HOUR_UTC:-12}
      EXPORT_URL: http://app:8080/api/exportar?dias=7
    depends_on:
      - app
    mem_limit: 128m
    cpus: 0.25

volumes:
  pgdata:
  noticias_uploads:
  capturas_mapas:
  archivo_capturas_comprimidas:
