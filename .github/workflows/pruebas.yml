name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clima
          POSTGRES_PASSWORD: pruebas
          POSTGRES_DB: clima_pruebas
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U clima -d clima_pruebas"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_USER: clima
      DB_PASS: pruebas
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: clima_pruebas
      STATION_PASSKEY: clave-de-pruebas
      ADMIN_PASSKEY: admin-de-pruebas
      PYTHONPATH: .

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ejecutar pruebas
        run: python -m pytest tests -v
