name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: clima
          POSTGRES_PASSWORD: pruebas
          POSTGRES_DB: clima_pruebas
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U clima -d clima_pruebas"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_USER: clima
      DB_PASS: pruebas
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: clima_pruebas
      STATION_PASSKEY: clave-de-pruebas
      ADMIN_PASSKEY: admin-de-pruebas
      PYTHONPATH: .

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requisitos/requirements.txt
            requisitos/requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requisitos/requirements-dev.txt

      - name: Ejecutar pruebas
        run: python -m pytest tests -v

      - name: Pruebas de JavaScript
        run: node --test "tests/js/*.test.mjs"

  dependencias:
    name: Dependencias (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Instalar pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Auditar vulnerabilidades conocidas
        run: pip-audit -r requisitos/requirements.txt
