<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>En mantenimiento — nuestroclima.co</title>
<link rel="stylesheet" href="/static/css/site/tokens.css?v=1">
<style>
  html, body{ height:100%; }
  body{
    margin:0; position:relative; overflow:hidden;
    background: linear-gradient(180deg, #f3caa0 0%, #e8a765 28%, #c97a4a 52%, #7a4f3f 78%, #3d3630 100%);
  }
  .escena{ position:absolute; inset:0; }
  .sol{ position:absolute; left:62%; top:22%; width:220px; height:220px; border-radius:50%;
    background:radial-gradient(circle, #fff6df 0%, #ffdca0 45%, rgba(255,220,160,0) 72%); }
  .niebla{ position:absolute; left:0; right:0; bottom:34%; height:120px;
    background:linear-gradient(180deg, rgba(255,244,230,0) 0%, rgba(255,244,230,.35) 100%); }

  .contenido{
    position:relative; z-index:2; min-height:100vh; display:flex; flex-direction:column;
    justify-content:center; padding:64px 8vw; box-sizing:border-box;
  }
  h1{
    color:#fff; font-family:'IBM Plex Sans', -apple-system, "Segoe UI", Roboto, sans-serif;
    font-weight:700; font-size:clamp(40px, 6.2vw, 84px); line-height:1.04; letter-spacing:-0.01em;
    margin:0 0 22px; text-wrap:balance; text-shadow:0 2px 18px rgba(0,0,0,.18); max-width:14ch;
  }
  p.sub{
    color:rgba(255,255,255,.92); font-family:'IBM Plex Sans', sans-serif; font-weight:500;
    font-size:15px; letter-spacing:.02em; margin:0; text-shadow:0 1px 8px rgba(0,0,0,.15);
  }
  .marca{
    position:absolute; z-index:2; left:8vw; bottom:34px;
    color:rgba(255,255,255,.75); font-family:'IBM Plex Sans', sans-serif; font-size:12px; letter-spacing:.04em;
  }
</style>
</head>
<body>
  <div class="escena">
    <div class="sol"></div>
    <svg width="100%" height="100%" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" style="position:absolute;inset:0;">
      <path d="M0 620 L120 520 240 600 380 480 520 590 660 500 820 610 980 510 1140 600 1300 520 1440 600 1600 540 1600 900 0 900 Z" fill="#3d5a3a" opacity=".55"/>
      <path d="M0 700 L160 600 340 680 520 570 720 690 900 580 1100 700 1300 600 1600 700 1600 900 0 900 Z" fill="#2c4327" opacity=".7"/>
      <path d="M0 780 L220 700 460 800 700 690 940 800 1180 700 1600 800 1600 900 0 900 Z" fill="#1c2e19"/>
    </svg>
    <div class="niebla"></div>
  </div>

  <div class="contenido">
    <h1>Son tiempos<br>de cambio</h1>
    <p class="sub">Estamos en mantenimiento, próximamente.</p>
  </div>
  <div class="marca">www.nuestroclima.co</div>
</body>
</html>
