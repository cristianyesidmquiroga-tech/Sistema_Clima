{% extends "_base.html" %}
{% block titulo %}Error del servidor — nuestroclima.co{% endblock %}
{% block contenido %}
  <div style="max-width:520px;margin:70px auto;text-align:center;">
    <p style="font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--alerta-roja);font-weight:600;margin:0 0 10px;">Error 500</p>
    <h1 style="font-size:26px;font-weight:700;margin:0 0 14px;">Algo salió mal de nuestro lado</h1>
    <p style="font-size:14.5px;color:var(--ink-soft);line-height:1.7;margin:0 0 26px;">
      Tuvimos un problema procesando tu solicitud. Ya quedó registrado — intenta de nuevo en unos
      minutos.
    </p>
    <a href="/" style="display:inline-block;background:var(--verde);color:#fff;border-radius:8px;padding:11px 22px;font-size:14px;font-weight:600;">Ir al inicio</a>
  </div>
{% endblock %}
